version: 1.0.0
name: LAVC Concreteness Core
# Dual-coding theory (Paivio): concrete words are encoded both verbally and
# imaginally; abstract words verbally only. Forcing an image onto an abstract
# word does not add a second code, it adds an interpretive burden.
#
# BANDS (Brysbaert, Warriner & Kuperman 2014, 1-5 scale):
#   >= 4.0  concrete  - a real referent exists; icon OR photograph licensed
#   2.5-4.0 semi      - schematic mark licensed, photograph is not
#   <  2.5  abstract  - no object depiction; typography, or a relationship
#                       diagram if the RELATION is concrete even though the
#                       entities are not
#
# The refinement that matters: schema concreteness and referent concreteness
# are separate tests. "Disbelief leads to withdrawal" has two abstract nouns
# but a concrete FORCE schema, so a causal arrow is licensed while an icon of
# "disbelief" is not.
#
# This file is a THREE-BAND REDUCTION of the ~40,000-word Brysbaert norms,
# covering the most frequent nouns, verbs and adjectives. Three bands is the
# only granularity the gate consumes. For full-precision ratings, drop the
# original dataset at grammar/lexicon/concreteness.txt (or set
# LAVC_CONCRETENESS_PATH) and it is preferred automatically - see
# scripts/fetch_concreteness.sh. The full dataset is deliberately NOT vendored:
# its redistribution terms are not clear enough to commit into a client repo.
#
# Cite: Brysbaert, M., Warriner, A.B., & Kuperman, V. (2014). Concreteness
# ratings for 40 thousand generally known English word lemmas.
# Behavior Research Methods, 46, 904-911.

thresholds:
  concrete: 4.0
  semi: 2.5

# Words absent from every band are `unknown` and the gate ABSTAINS rather than
# guessing - an unknown word never licenses a depiction.
